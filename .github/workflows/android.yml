name: Android build

on:
  workflow_dispatch:
  push:
    branches:
      - master
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: android-${{ github.event_name == 'release' && github.ref || 'nightly' }}
  cancel-in-progress: false

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract engine version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            VERSION="${RELEASE_TAG}"
          else
            VERSION=$(git describe --tags --always 2>/dev/null || echo "dev-${GITHUB_SHA::7}")
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "Building Alexandria version: ${VERSION}"

      - name: Install Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip -q android-ndk-r26d-linux.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r26d" >> $GITHUB_ENV

      - name: Download network
        run: |
          curl -fsSL https://github.com/PGG106/Alexandria-networks/releases/latest/download/nn.net -o nn.net

      - name: Patch Makefile for cross-compile
        run: |
          sed -i 's/-march=native -E -dM -/-E -dM -/' makefile
          git diff --stat makefile

      - name: Patch nnue.h for constexpr round
        run: |
          sed -i '/#pragma once/a constexpr double constexpr_round(double x) { return x >= 0.0 ? (double)(long long)(x + 0.5) : (double)(long long)(x - 0.5); }' src/nnue.h
          sed -i 's/std::round(/constexpr_round(/g' src/nnue.h
          grep -n constexpr_round src/nnue.h

      - name: Build host preprocess tool
        run: |
          cd tools
          g++ -funroll-loops -O3 -fno-exceptions -std=c++2b -DNDEBUG -o preprocess preprocess.cpp -pthread
          cd ..

      - name: Preprocess network
        run: |
          ./tools/preprocess nn.net processed.net

      - name: Build Alexandria (ARM64 v8-A)
        run: |
          make build=arm64 \
               CXX=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang++ \
               NATIVE="-march=armv8-a" \
               CXXFLAGS="-funroll-loops -O3 -fno-exceptions -std=c++2b -DNDEBUG -DEVALFILE=\\\"processed.net\\\" --target=aarch64-linux-android28 -static-libstdc++" \
               Alexandria
          mv Alexandria Alexandria-${{ env.VERSION }}-android-arm64-v8a

      - name: Build Alexandria (ARM64 DotProd - Cortex A76+)
        run: |
          rm -rf .tmp Alexandria
          make build=arm64 \
               CXX=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang++ \
               NATIVE="-march=armv8.2-a+dotprod" \
               CXXFLAGS="-funroll-loops -O3 -fno-exceptions -std=c++2b -DNDEBUG -DEVALFILE=\\\"processed.net\\\" --target=aarch64-linux-android28 -static-libstdc++" \
               Alexandria
          mv Alexandria Alexandria-${{ env.VERSION }}-android-arm64-dotprod

      - name: List build output
        run: |
          ls -lh Alexandria-${{ env.VERSION }}-android-*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alexandria-${{ env.VERSION }}-android-binaries
          retention-days: 30
          if-no-files-found: error
          path: |
            Alexandria-${{ env.VERSION }}-android-arm64-v8a
            Alexandria-${{ env.VERSION }}-android-arm64-dotprod

      - name: Publish rolling prerelease (master)
        if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view android-nightly >/dev/null 2>&1; then
            gh release delete android-nightly --cleanup-tag --yes
          fi
          gh release create android-nightly \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Alexandria ${VERSION} (Android)" \
            --notes "Built from ${GITHUB_SHA} on ${GITHUB_REF_NAME}" \
            Alexandria-${VERSION}-android-arm64-v8a \
            Alexandria-${VERSION}-android-arm64-dotprod

      - name: Attach binaries to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "${RELEASE_TAG}" \
            Alexandria-${VERSION}-android-arm64-v8a \
            Alexandria-${VERSION}-android-arm64-dotprod \
            --clobber
